# debug:disable_logs = false
binds:allow_pin_fullscreen = true

# pywal
source = /home/$USER/.cache/wal/colors-hyprland

# Monitors
monitor = , preferred, auto, 1

# env vars
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# local vars
$terminal = footclient
$filemanager = thunar
$menu = pkill fzfmenu || footclient -T fzfmenu fzfmenu
$clippy = pkill clippy || footclient -T clippy clippy
$browser = firefox --new-tab about:blank
$scratchpad = toggle-scratchpad-term
$ai = toggle-ai-window

# setup
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = hyprctl plugin load "${HOME}/.local/share/hyprpm/dynamic-cursors/dynamic-cursors.so"
exec-once = wl-paste --watch cliphist store
exec-once = set-wallpaper
exec-once = foot --server
exec-once = hyprpm reload -n

# env vars
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,30

# Plugins
plugin:dynamic-cursors {
    mode = stretch
    threshold = 2
    shaperule = grab, stretch, stretch:limit: 2000
    stretch {
        limit = 1000
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        function = negative_quadratic
    }
    shake {
        enabled = true
    }
}

general { 
    gaps_in = 2
    gaps_out = 10
    border_size = 0
    # col.active_border = 0xcc888888  # medium grey, 80% opacity
    # col.inactive_border = 0x00000000  # 100% transparent
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.78
    inactive_opacity = 0.70
    fullscreen_opacity = 1
    dim_special = 0.8
    blur {
        enabled = true
    	size = 3
    	passes = 5
    	new_optimizations = true
    	ignore_opacity = true
    	xray = false
    	popups = false
    }
    shadow {
        enabled = true
        range = 15
        render_power = 5
        color = rgba(0, 0, 0, .5)
    }
}

animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 1, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1, snappy, slide
    animation = specialWorkspace, 1, 1, fluid, fade
    animation = layers, 1, 2, snappy, popin 70%
    animation = fadeOut, 0
    animation = fadeIn, 0
}

dwindle {
    preserve_split = true
}

misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
    vfr = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
    repeat_rate = 50
    repeat_delay = 200
}

gestures {
    workspace_swipe = true
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = .05
    workspace_swipe_min_speed_to_force = 0
}

# keybinds
bindr = SUPER, SUPER_L, exec, $menu
bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, killactive
bind = SUPER, E, exec, $filemanager
bind = SUPER, Y, togglefloating 
bind = SUPER, U, pseudo
bind = SUPER, I, togglesplit
bind = SUPER, F, fullscreen
bind = SUPER, O, exec, hyprlock
bind = SUPER, P, pin
bind = SUPER, G, togglespecialworkspace, magic
bind = SUPER Control_L, G, movetoworkspacesilent, special:magic
bind = SUPER, B, exec, $browser
bind = SUPER, C, exec, $clippy

# Move focus
bind = SUPER, H, exec, hyprmovefocus l
bind = SUPER, J, exec, hyprmovefocus d
bind = SUPER, K, exec, hyprmovefocus u
bind = SUPER, L, exec, hyprmovefocus r

# Move windows
bind = SUPER Control_L, H, movewindow, l
bind = SUPER Control_L, J, movewindow, d 
bind = SUPER Control_L, K, movewindow, u
bind = SUPER Control_L, L, movewindow, r

# Switch workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move windows to workspaces
bind = SUPER Control_L, 1, movetoworkspace, 1
bind = SUPER Control_L, 2, movetoworkspace, 2
bind = SUPER Control_L, 3, movetoworkspace, 3
bind = SUPER Control_L, 4, movetoworkspace, 4
bind = SUPER Control_L, 5, movetoworkspace, 5
bind = SUPER Control_L, 6, movetoworkspace, 6
bind = SUPER Control_L, 7, movetoworkspace, 7
bind = SUPER Control_L, 8, movetoworkspace, 8
bind = SUPER Control_L, 9, movetoworkspace, 9
bind = SUPER Control_L, 0, movetoworkspace, 10

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl setsp-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = CTRL, Print, exec, hyprshot -m window -o ~/Screenshots/
bind = , Print, exec, hyprshot -m region -o ~/Screenshots/
bind = ALT, Print, exec, hyprshot -m active -m output -o ~/Screenshots/
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Workspace rules
workspace = special:magic, gapsin:30, gapsout:130

# Layerrules
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = noanim, selection

# fzfmenu
windowrule = float, title:fzfmenu
windowrule = dimaround, title:fzfmenu
windowrule = bordersize 0, title:fzfmenu
windowrule = pin, title:fzfmenu
windowrule = stayfocused, title:fzfmenu
windowrule = size <20% <25%, title:fzfmenu

# Clippy
windowrule = float, title:clippy
windowrule = dimaround, title:clippy
windowrule = bordersize 0, title:clippy
windowrule = pin, title:clippy
windowrule = stayfocused, title:clippy
windowrule = size <30% <35%, title:clippy

# Terminal scratchpad
windowrule = float, title:foot_scratchpad
windowrule = pin, title:foot_scratchpad
windowrule = size 40% 40%, title:foot_scratchpad
windowrule = move 30% 5, title:foot_scratchpad
bind = SUPER, SPACE, exec, $scratchpad

# AI Window
windowrule = float, initialClass:ai-window-ff
windowrule = pin, initialClass:ai-window-ff
windowrule = size 25% 75%, initialClass:ai-window-ff
windowrule = move 74% 12.5%, initialClass:ai-window-ff
bind = SUPER, A, exec, $ai

